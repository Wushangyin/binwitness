[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "binwitness"
dynamic = ["version"]
description = "Evidence-backed software composition analysis for delivered binaries: jars, wars, container images and front-end builds."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Wushangyin" }]
keywords = ["sca", "sbom", "cyclonedx", "osv", "vulnerability", "license", "supply-chain", "audit", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Wushangyin/binwitness"
Documentation = "https://github.com/Wushangyin/binwitness#readme"
Issues = "https://github.com/Wushangyin/binwitness/issues"
Changelog = "https://github.com/Wushangyin/binwitness/releases"

[project.optional-dependencies]
test = ["pytest>=7"]
# `binwitness mcp`: the scanner itself needs none of it.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
binwitness = "binwitness.cli:main"

[tool.setuptools.dynamic]
version = { attr = "binwitness.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
